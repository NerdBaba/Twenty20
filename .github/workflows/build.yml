name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build Twenty20.dmg
        run: ./scripts/make_dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Twenty20-macos
          path: build/Twenty20.dmg
          retention-days: 30
