name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build Twenty20.dmg
        run: ./scripts/make_dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Twenty20-macos
          path: build/Twenty20.dmg
          retention-days: 30

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag -f latest HEAD
          git push -f origin latest
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --prerelease --title "Twenty20 (latest)" \
              --notes "Rolling build from main."
          gh release upload latest build/Twenty20.dmg --clobber
