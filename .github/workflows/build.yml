name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Twenty20.app
        run: ./scripts/package_app.sh

      - name: Zip app
        run: ditto -c -k --keepParent build/Twenty20.app build/Twenty20.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Twenty20-macos
          path: build/Twenty20.zip
          retention-days: 30
